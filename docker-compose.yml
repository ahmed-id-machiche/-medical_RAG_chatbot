version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: tbibk_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: always

  tbibk_app:
    build: .
    container_name: tbibk_streamlit
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ./data:/app/data
      - ./index:/app/index
      - ./conversations:/app/conversations
    restart: always

volumes:
  ollama_storage:
